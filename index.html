<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .form-label {
            font-weight: 600;
            color: #333;
        }
        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: transform 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="hero p-5 text-center">
                    <h1 class="mb-4">
                        <i class="fas fa-car-side me-3"></i>
                        Smart Car Price Predictor
                    </h1>
                    <p class="lead text-white-50 mb-5">Enter your car details to get instant price prediction!</p>
                    
                    <form action="/predict" method="POST" id="predictForm">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label for="car_brand" class="form-label">Car Brand</label>
                                <select class="form-select" id="car_brand" name="car_brand" required>
                                    <option value="">Select Brand</option>
                                    <option value="Hyundai">Hyundai</option>
                                    <option value="Tata">Tata</option>
                                    <option value="Mahindra">Mahindra</option>
                                    <option value="BMW">BMW</option>
                                    <option value="Honda">Honda</option>
                                    <option value="Audi">Audi</option>
                                    <option value="Toyota">Toyota</option>
                                    <option value="Kia">Kia</option>
                                    <option value="Maruti">Maruti</option>
                                    <option value="Ford">Ford</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="engine_condition" class="form-label">Engine Condition</label>
                                <select class="form-select" id="engine_condition" name="engine_condition" required>
                                    <option value="">Select Condition</option>
                                    <option value="Poor">Poor</option>
                                    <option value="Average">Average</option>
                                    <option value="Good">Good</option>
                                    <option value="Excellent">Excellent</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="fuel_type" class="form-label">Fuel Type</label>
                                <select class="form-select" id="fuel_type" name="fuel_type" required>
                                    <option value="">Select Fuel</option>
                                    <option value="Petrol">Petrol</option>
                                    <option value="Hybrid">Hybrid</option>
                                    <option value="Diesel">Diesel</option>
                                    <option value="Electric">Electric</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="reparation_work" class="form-label">Reparation Work</label>
                                <select class="form-select" id="reparation_work" name="reparation_work" required>
                                    <option value="">Select</option>
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="purchase_value" class="form-label">Purchase Value (₹)</label>
                                <input type="number" class="form-control" id="purchase_value" name="purchase_value" required min="0" step="1000">
                            </div>
                            <div class="col-md-3">
                                <label for="no_of_buyers" class="form-label"># of Buyers</label>
                                <input type="number" class="form-control" id="no_of_buyers" name="no_of_buyers" required min="0">
                            </div>
                            <div class="col-md-3">
                                <label for="kilometer_running" class="form-label">Km Running</label>
                                <input type="number" class="form-control" id="kilometer_running" name="kilometer_running" required min="0">
                            </div>
                            <div class="col-md-3">
                                <label for="car_age" class="form-label">Car Age (Years)</label>
                                <input type="number" class="form-control" id="car_age" name="car_age" required min="0">
                            </div>
                        </div>
                        <div class="text-center mt-5">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-magic me-2"></i>
                                Predict Price
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form validation feedback
        document.getElementById('predictForm').addEventListener('submit', function(e) {
            if (!this.checkValidity()) {
                e.preventDefault();
                alert('Please fill all fields correctly!');
            }
        });
    </script>
</body>
</html>
